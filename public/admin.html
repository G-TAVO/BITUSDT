<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin | Juego Tavo Demo</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#0f172a;
color:white;
}

.container{
max-width:950px;
margin:auto;
padding:20px;
padding-bottom:80px;
}

h1{
text-align:center;
color:#00ffcc;
margin-bottom:10px;
}

h2{
color:#38bdf8;
margin-top:30px;
}

.top{
background:#111827;
padding:20px;
border-radius:15px;
text-align:center;
border:1px solid #334155;
}

.demo{
color:#facc15;
font-size:18px;
font-weight:bold;
margin-top:8px;
}

.stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin-top:15px;
}

.stat{
background:#111827;
padding:18px;
border-radius:12px;
text-align:center;
border:1px solid #334155;
}

.numero{
font-size:25px;
font-weight:bold;
color:#38bdf8;
margin-top:5px;
}

.card{
background:#1e293b;
padding:18px;
border-radius:14px;
margin-top:15px;
border:1px solid #334155;
}

.card b{
font-size:17px;
}

.info{
line-height:1.8;
margin-top:8px;
}

.saldo{
font-size:20px;
font-weight:bold;
color:#22c55e;
}

.activo{
color:#22c55e;
font-weight:bold;
}

.bloqueado{
color:#ef4444;
font-weight:bold;
}

button{
padding:11px 14px;
border:0;
border-radius:8px;
margin:5px 3px;
cursor:pointer;
color:white;
font-weight:bold;
font-size:14px;
}

button:active{
transform:scale(.97);
}

.recargar{
background:#8b5cf6;
}

.quitar{
background:#f97316;
}

.bloquear{
background:#ef4444;
}

.desbloquear{
background:#3b82f6;
}

.aprobar{
background:#22c55e;
}

.rechazar{
background:#ef4444;
}

.actualizar{
background:#0891b2;
width:100%;
margin-top:20px;
padding:13px;
}

.salir{
background:#ef4444;
width:100%;
padding:14px;
margin-top:30px;
font-size:16px;
}

.vacio{
background:#1e293b;
padding:18px;
border-radius:10px;
text-align:center;
opacity:.8;
margin-top:10px;
}

.separador{
height:1px;
background:#334155;
margin:12px 0;
}

.modal{
display:none;
position:fixed;
z-index:1000;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.8);
padding:20px;
}

.modal-content{
background:#1e293b;
max-width:420px;
margin:70px auto;
padding:22px;
border-radius:15px;
border:1px solid #475569;
}

.modal-content h3{
color:#38bdf8;
margin-top:0;
}

.modal-content input{
width:100%;
padding:13px;
margin:8px 0;
border:0;
border-radius:8px;
font-size:16px;
}

.confirmar{
background:#22c55e;
width:100%;
}

.cancelar{
background:#64748b;
width:100%;
}

@media(max-width:600px){

.container{
padding:12px;
}

.stats{
grid-template-columns:1fr 1fr;
}

button{
font-size:13px;
}

}

</style>

</head>

<body>

<div class="container">

<h1>👑 PANEL ADMINISTRADOR</h1>

<div class="top">

<div>🎰 JUEGO TAVO DEMO</div>

<div class="demo">
⚠️ TODO EL DINERO ES FICTICIO
</div>

<small>
Panel administrativo
</small>

</div>


<!-- ========================= -->
<!-- ESTADÍSTICAS -->
<!-- ========================= -->

<h2>📊 Estadísticas</h2>

<div class="stats">

<div class="stat">

Usuarios

<div
class="numero"
id="totalUsuarios">
0
</div>

</div>


<div class="stat">

Partidas

<div
class="numero"
id="totalPartidas">
0
</div>

</div>


<div class="stat">

Dinero Demo

<div
class="numero"
id="totalDinero">
$0
</div>

</div>


<div class="stat">

Retiros pendientes

<div
class="numero"
id="totalRetiros">
0
</div>

</div>

</div>


<!-- ========================= -->
<!-- USUARIOS -->
<!-- ========================= -->

<h2>👥 Usuarios</h2>

<div id="usuarios">

Cargando usuarios...

</div>


<!-- ========================= -->
<!-- RETIROS -->
<!-- ========================= -->

<h2>💸 Retiros Demo</h2>

<div id="retiros">

Cargando retiros...

</div>


<!-- ========================= -->
<!-- PARTIDAS -->
<!-- ========================= -->

<h2>🎰 Últimas Partidas</h2>

<div id="partidas">

Cargando partidas...

</div>


<button
class="actualizar"
onclick="cargarTodo()">

🔄 Actualizar panel

</button>


<button
class="salir"
onclick="salir()">

🚪 Cerrar sesión

</button>

</div>


<!-- ========================= -->
<!-- MODAL SALDO -->
<!-- ========================= -->

<div
class="modal"
id="modalSaldo">

<div class="modal-content">

<h3 id="tituloModal">
Modificar saldo
</h3>

<p id="usuarioModal"></p>

<input
type="number"
id="monto"
min="1"
placeholder="Monto"
>

<input
type="text"
id="motivo"
placeholder="Motivo (opcional)"
>

<button
class="confirmar"
onclick="confirmarSaldo()">

Confirmar

</button>

<button
class="cancelar"
onclick="cerrarModal()">

Cancelar

</button>

</div>

</div>


<script>

/* =====================================================
VALIDAR ADMIN
===================================================== */

const usuario =
JSON.parse(
localStorage.getItem("usuario")
);

if(
!usuario ||
usuario.rol !== "admin"
){

alert("Acceso denegado");

location.href="/";

}


/* =====================================================
VARIABLES
===================================================== */

let usuarioSeleccionado = null;

let operacionSaldo = "";


/* =====================================================
FORMATO DINERO
===================================================== */

function dinero(valor){

return Number(valor || 0)
.toLocaleString("es-CO");

}


/* =====================================================
CARGAR TODO
===================================================== */

cargarTodo();


async function cargarTodo(){

await Promise.all([

cargarUsuarios(),

cargarRetiros(),

cargarPartidas(),

cargarEstadisticas()

]);

}


/* =====================================================
USUARIOS
===================================================== */

async function cargarUsuarios(){

try{

const res =
await fetch(
"/api/admin/usuarios"
);

const data =
await res.json();

const box =
document.getElementById(
"usuarios"
);

if(
!data.ok ||
!Array.isArray(data.usuarios) ||
data.usuarios.length === 0
){

box.innerHTML = `
<div class="vacio">
No hay usuarios registrados.
</div>
`;

return;

}

box.innerHTML = "";

data.usuarios.forEach(u=>{

box.innerHTML += `

<div class="card">

<b>
👤 ${escapeHtml(u.nombre)}
</b>

<div class="info">

📧 ${escapeHtml(u.email)}

<br>

📱 ${escapeHtml(
u.telefono || "Sin teléfono"
)}

<br>

💰 Saldo Demo:

<span class="saldo">
$${dinero(u.saldo)}
</span>

<br>

Estado:

${
u.bloqueado

?

`<span class="bloqueado">
🚫 BLOQUEADO
</span>`

:

`<span class="activo">
✅ ACTIVO
</span>`
}

</div>

<div class="separador"></div>


<button
class="recargar"
onclick='abrirSaldo(
${JSON.stringify(u.email)},
${JSON.stringify(u.nombre)},
"agregar"
)'>

➕ Agregar saldo

</button>


<button
class="quitar"
onclick='abrirSaldo(
${JSON.stringify(u.email)},
${JSON.stringify(u.nombre)},
"quitar"
)'>

➖ Quitar saldo

</button>


${
u.bloqueado

?

`

<button
class="desbloquear"
onclick='cambiarBloqueo(
${JSON.stringify(u.email)},
false
)'>

🔓 Desbloquear

</button>

`

:

`

<button
class="bloquear"
onclick='cambiarBloqueo(
${JSON.stringify(u.email)},
true
)'>

🚫 Bloquear

</button>

`
}

</div>

`;

});

}catch(error){

console.error(error);

document.getElementById(
"usuarios"
).innerHTML = `

<div class="vacio">

❌ No se pudieron cargar los usuarios.

</div>

`;

}

}


/* =====================================================
ABRIR MODAL
===================================================== */

function abrirSaldo(
email,
nombre,
operacion
){

usuarioSeleccionado = {
email,
nombre
};

operacionSaldo = operacion;

document.getElementById(
"tituloModal"
).textContent =
operacion === "agregar"
?
"➕ Agregar saldo demo"
:
"➖ Quitar saldo demo";

document.getElementById(
"usuarioModal"
).innerHTML =
`
Usuario:
<b>${escapeHtml(nombre)}</b>
<br>
${escapeHtml(email)}
`;

document.getElementById(
"monto"
).value = "";

document.getElementById(
"motivo"
).value = "";

document.getElementById(
"modalSaldo"
).style.display =
"block";

}


/* =====================================================
CERRAR MODAL
===================================================== */

function cerrarModal(){

document.getElementById(
"modalSaldo"
).style.display =
"none";

usuarioSeleccionado = null;

}


/* =====================================================
CONFIRMAR SALDO
===================================================== */

async function confirmarSaldo(){

if(!usuarioSeleccionado){

alert(
"No hay usuario seleccionado"
);

return;

}

const monto =
Number(
document.getElementById(
"monto"
).value
);

const motivo =
document.getElementById(
"motivo"
).value.trim();


if(
!Number.isInteger(monto) ||
monto <= 0
){

alert(
"Introduce un monto válido"
);

return;

}


const accion =
operacionSaldo === "agregar"
?
"agregar"
:
"quitar";


if(
!confirm(
`¿${accion === "agregar"
? "Agregar"
: "Quitar"} $${dinero(monto)}
de saldo demo a ${usuarioSeleccionado.nombre}?`
)
){

return;

}


try{

let url;

if(
operacionSaldo === "agregar"
){

url =
"/api/admin/recargar";

}else{

url =
"/api/admin/quitar-saldo";

}


const res =
await fetch(
url,
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({

email:
usuarioSeleccionado.email,

monto:monto,

motivo:
motivo ||
"Operación realizada por administrador"

})
}
);


const data =
await res.json();


alert(
data.msg ||
"Operación realizada"
);


if(data.ok){

cerrarModal();

await cargarTodo();

}

}catch(error){

console.error(error);

alert(
"❌ Error comunicando con el servidor"
);

}

}


/* =====================================================
BLOQUEAR / DESBLOQUEAR
===================================================== */

async function cambiarBloqueo(
email,
bloquear
){

const accion =
bloquear
?
"bloquear"
:
"desbloquear";


if(
!confirm(
`¿Quieres ${accion} este usuario?`
)
){

return;

}


try{

const url =
bloquear
?
"/api/admin/bloquear"
:
"/api/admin/desbloquear";


const res =
await fetch(
url,
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
email
})
}
);


const data =
await res.json();


alert(
data.msg ||
"Operación realizada"
);


await cargarUsuarios();


}catch(error){

console.error(error);

alert(
"❌ Error realizando la operación"
);

}

}


/* =====================================================
RETIROS
===================================================== */

async function cargarRetiros(){

try{

const res =
await fetch(
"/api/admin/retiros"
);

const data =
await res.json();

const box =
document.getElementById(
"retiros"
);


if(
!data.ok ||
!Array.isArray(data.retiros) ||
data.retiros.length === 0
){

box.innerHTML = `

<div class="vacio">

No hay retiros registrados.

</div>

`;

return;

}


box.innerHTML = "";


data.retiros
.slice(0,50)
.forEach(r=>{

box.innerHTML += `

<div class="card">

<b>
👤 ${escapeHtml(r.nombre)}
</b>

<div class="info">

📧 ${escapeHtml(r.email)}

<br>

💰 Monto:
<span class="saldo">
$${dinero(r.monto)}
</span>

<br>

📱 Nequi Demo:
${escapeHtml(r.nequi || "No registrado")}

<br>

📌 Estado:
<b>${escapeHtml(r.estado)}</b>

<br>

<small>
${escapeHtml(r.fecha || "")}
</small>

</div>


${
r.estado === "pendiente"

?

`

<div class="separador"></div>

<button
class="aprobar"
onclick='procesarRetiro(
${JSON.stringify(r._id)},
"aprobar"
)'>

✅ Aprobar

</button>


<button
class="rechazar"
onclick='procesarRetiro(
${JSON.stringify(r._id)},
"rechazar"
)'>

❌ Rechazar

</button>

`

:
""

}

</div>

`;

});

}catch(error){

console.error(error);

document.getElementById(
"retiros"
).innerHTML =
`
<div class="vacio">
❌ Error cargando retiros.
</div>
`;

}

}


/* =====================================================
PROCESAR RETIRO
===================================================== */

async function procesarRetiro(
id,
accion
){

if(
!confirm(
accion === "aprobar"
?
"¿Aprobar este retiro demo?"
:
"¿Rechazar este retiro demo?"
)
){

return;

}


const url =
accion === "aprobar"
?
"/api/admin/aprobar-retiro"
:
"/api/admin/rechazar-retiro";


try{

const res =
await fetch(
url,
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
id
})
}
);


const data =
await res.json();


alert(
data.msg ||
"Operación realizada"
);


await cargarTodo();


}catch(error){

console.error(error);

alert(
"❌ Error procesando retiro"
);

}

}


/* =====================================================
PARTIDAS
===================================================== */

async function cargarPartidas(){

try{

const res =
await fetch(
"/api/admin/partidas"
);

const data =
await res.json();

const box =
document.getElementById(
"partidas"
);


if(
!data.ok ||
!Array.isArray(data.partidas) ||
data.partidas.length === 0
){

box.innerHTML = `

<div class="vacio">

Todavía no hay partidas.

</div>

`;

return;

}


box.innerHTML = "";


data.partidas
.slice(0,30)
.forEach(p=>{

box.innerHTML += `

<div class="card">

<b>
👤 ${escapeHtml(
p.nombre || p.email
)}
</b>

<div class="info">

🔢 Número elegido:
<b>
${numeroVisual(p.numeroElegido)}
</b>

<br>

🎯 Número salido:
<b>
${numeroVisual(p.numeroRuleta)}
</b>

<br>

💰 Apuesta:
$${dinero(p.apuesta)}

<br>

🏆 Premio:
$${dinero(p.premio)}

<br>

Resultado:

${
p.resultado === "gano"

?

`<span class="activo">
🎉 GANÓ
</span>`

:

`<span class="bloqueado">
❌ PERDIÓ
</span>`
}

<br>

<small>
${escapeHtml(p.fecha || "")}
</small>

</div>

</div>

`;

});

}catch(error){

console.error(error);

document.getElementById(
"partidas"
).innerHTML =
`
<div class="vacio">
❌ Error cargando partidas.
</div>
`;

}

}


/* =====================================================
ESTADÍSTICAS
===================================================== */

async function cargarEstadisticas(){

try{

const res =
await fetch(
"/api/admin/estadisticas"
);

const data =
await res.json();


if(
!data.ok ||
!data.estadisticas
){

return;

}


const e =
data.estadisticas;


document.getElementById(
"totalUsuarios"
).textContent =
e.usuarios || 0;


document.getElementById(
"totalPartidas"
).textContent =
e.partidas || 0;


document.getElementById(
"totalDinero"
).textContent =
"$" +
dinero(
e.dineroDemoTotal || 0
);


document.getElementById(
"totalRetiros"
).textContent =
e.retirosPendientes || 0;


}catch(error){

console.error(
"Error estadísticas:",
error
);

}

}


/* =====================================================
NÚMERO VISUAL
===================================================== */

function numeroVisual(numero){

return String(
numero
).padStart(2,"0");

}


/* =====================================================
ESCAPAR HTML
===================================================== */

function escapeHtml(text){

return String(text || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
CERRAR SESIÓN
===================================================== */

function salir(){

localStorage.removeItem(
"usuario"
);

location.href="/";

}


/* =====================================================
CERRAR MODAL AFUERA
===================================================== */

window.onclick =
function(event){

const modal =
document.getElementById(
"modalSaldo"
);

if(
event.target === modal
){

cerrarModal();

}

};


/* =====================================================
ACTUALIZACIÓN AUTOMÁTICA
===================================================== */

setInterval(
cargarTodo,
10000
);

</script>

</body>

</html>
