<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Préstamos Tavo</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#020617,#0f172a);
  color:white;
}

header{
  background:#020617;
  padding:15px;
  text-align:center;
  font-size:22px;
  color:#00ffcc;
  font-weight:bold;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
  box-shadow:0 0 10px rgba(0,0,0,0.5);
}

h2{
  text-align:center;
  color:#00ffcc;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,td{
  padding:10px;
  border-bottom:1px solid #333;
  text-align:center;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.btn-aprobar{
  background:#22c55e;
  color:white;
}

.btn-rechazar{
  background:#ef4444;
  color:white;
}

.btn-salir{
  width:100%;
  margin-top:20px;
  background:#ef4444;
  color:white;
}

.estado{
  text-align:center;
  margin-top:10px;
  font-size:14px;
  color:#ccc;
}
</style>
</head>

<body>

<header>👑 PANEL ADMIN - PRÉSTAMOS TAVO</header>

<div class="container">

<div class="card">
<h2>Solicitudes pendientes</h2>

<div class="estado" id="estado">Cargando...</div>

<table>
<thead>
<tr>
<th>Nombre</th>
<th>Email</th>
<th>Monto</th>
<th>Acciones</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

</div>

<button class="btn-salir" onclick="salir()">Cerrar sesión</button>

</div>

<script>

/* 🔒 PROTECCIÓN ADMIN */
const usuario = JSON.parse(localStorage.getItem("usuario"));

if(!usuario || usuario.rol !== "admin"){
  alert("Debes iniciar sesión como admin");
  window.location.href = "/";
}

/* 📥 CARGAR SOLICITUDES */
async function cargar(){

  try{
    const res = await fetch("/api/solicitudes");
    const data = await res.json();

    const tabla = document.getElementById("tabla");
    const estado = document.getElementById("estado");

    tabla.innerHTML = "";

    if(data.length === 0){
      estado.innerText = "No hay solicitudes pendientes";
      return;
    }

    estado.innerText = "Solicitudes encontradas: " + data.length;

    data.forEach(s=>{
      tabla.innerHTML += `
        <tr>
          <td>${s.nombre}</td>
          <td>${s.email}</td>
          <td>$${s.monto}</td>
          <td>
            <button class="btn-aprobar" onclick="aprobar('${s._id}')">✔ Aprobar</button>
            <button class="btn-rechazar" onclick="rechazar('${s._id}')">✖ Rechazar</button>
          </td>
        </tr>
      `;
    });

  }catch(err){
    document.getElementById("estado").innerText = "Error cargando datos";
  }
}

/* ✅ APROBAR */
async function aprobar(id){

  if(!confirm("¿Aprobar este préstamo?")) return;

  const res = await fetch("/api/aprobar",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ id })
  });

  const data = await res.json();
  alert(data.msg);

  cargar();
}

/* ❌ RECHAZAR */
async function rechazar(id){

  if(!confirm("¿Rechazar solicitud?")) return;

  const res = await fetch("/api/rechazar",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ id })
  });

  const data = await res.json();
  alert(data.msg);

  cargar();
}

/* 🚪 SALIR */
function salir(){
  localStorage.clear();
  window.location.href = "/";
}

/* 🚀 INICIO */
cargar();

</script>

</body>
</html>
