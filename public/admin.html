<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Préstamos Tavo</title>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
}
.container{
  max-width:600px;
  margin:auto;
  padding:20px;
}
.card{
  background:#1e293b;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
}
button{
  padding:10px;
  border:none;
  border-radius:8px;
  margin:5px;
  cursor:pointer;
  color:white;
}
.aprobar{ background:#22c55e }
.rechazar{ background:#ef4444 }
</style>
</head>

<body>

<div class="container">
  <h2>Panel Admin</h2>
  <div id="lista">Cargando...</div>
</div>

<script>

// 🔒 VALIDAR ADMIN
const usuario = JSON.parse(localStorage.getItem("usuario"));

if(!usuario || usuario.rol !== "admin"){
  alert("Acceso denegado");
  window.location.href="/";
}

// 📥 CARGAR SOLICITUDES
async function cargar(){

  const res = await fetch("/api/solicitudes");
  const data = await res.json();

  const cont = document.getElementById("lista");

  if(data.length === 0){
    cont.innerHTML = "No hay solicitudes";
    return;
  }

  cont.innerHTML = "";

  data.forEach(s => {

    cont.innerHTML += `
      <div class="card">
        <p><b>Nombre:</b> ${s.nombre}</p>
        <p><b>Email:</b> ${s.email}</p>
        <p><b>Monto:</b> $${s.monto}</p>

        <button class="aprobar" onclick="aprobar('${s._id}')">Aprobar</button>
        <button class="rechazar" onclick="rechazar('${s._id}')">Rechazar</button>
      </div>
    `;

  });

}

cargar();


// ✅ APROBAR
async function aprobar(id){

  const res = await fetch("/api/aprobar",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ id })
  });

  const data = await res.json();
  alert(data.msg);

  cargar();
}


// ❌ RECHAZAR
async function rechazar(id){

  const res = await fetch("/api/rechazar",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ id })
  });

  const data = await res.json();
  alert(data.msg);

  cargar();
}

</script>

</body>
</html>
