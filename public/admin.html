<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#000428,#004e92);
  color:white;
  padding:20px;
}

.container{
  max-width:1100px;
  margin:auto;
}

h2{
  text-align:center;
  color:#00ffcc;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
  background:#111827;
  border-radius:10px;
  overflow:hidden;
}

th, td{
  padding:10px;
  text-align:center;
  border-bottom:1px solid #333;
}

th{
  background:#1f2937;
}

button{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  color:white;
}

.btn-ok{ background:#22c55e; }
.btn-no{ background:#ef4444; }

.btn-red{
  background:#ef4444;
  margin-top:20px;
  width:100%;
  padding:10px;
}
</style>
</head>
<body>

<div class="container">
<h2>Solicitudes Pendientes</h2>

<table>
<thead>
<tr>
<th>Email</th>
<th>Tipo</th>
<th>Monto</th>
<th>Saldo</th>
<th>Wallet</th>
<th>Acción</th>
<th>Editar Saldo</th>
</tr>
</thead>
<tbody id="tablaSolicitudes"></tbody>
</table>
<h2>Usuarios</h2>

<table>
<thead>
<tr>
<th>Email</th>
<th>Saldo</th>
<th>Días</th>
<th>Wallet</th>
<th>Editar</th>
</tr>
</thead>
<tbody id="tablaUsuarios"></tbody>
</table>
<button class="btn-red" onclick="salir()">Cerrar sesión</button>
</div>

<script>
/* ===== VALIDAR ADMIN ===== */
const usuario = JSON.parse(localStorage.getItem("usuario"));

if(!usuario || usuario.rol !== "admin"){
  window.location.href = "/";
}

/* ===== ADMIN KEY ===== */
const ADMIN_KEY = "ADMIN123";

/* ================= CARGAR SOLICITUDES ================= */
async function cargarSolicitudes(){
  const res = await fetch("/api/solicitudes");
  const data = await res.json();

  const tabla = document.getElementById("tablaSolicitudes");
  tabla.innerHTML = "";

  if(data.length === 0){
    tabla.innerHTML = `
      <tr>
        <td colspan="6">No hay solicitudes pendientes</td>
      </tr>
    `;
    return;
  }

  data.forEach(s=>{
  tabla.innerHTML += `
    <tr>
      <td>${s.email}</td>
      <td>${s.tipo}</td>
      <td>${s.monto} USDT</td>
      <td>${s.wallet || "-"}</td>
      <td>
        <button class="btn-ok" onclick="aprobar('${s._id}')">✅</button>
        <button class="btn-no" onclick="rechazar('${s._id}')">❌</button>
        <button onclick="editarSaldo('${s.email}')">✏️</button>
      </td>
    </tr>
  `;
});
}
async function editarSaldo(email){
  const nuevo = prompt("Nuevo saldo para " + email);

  if(nuevo === null) return;

  const res = await fetch("/api/modificar-saldo", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      email: email,
      monto: nuevo
    })
  });

  const data = await res.json();
  alert(data.msg);
}
/* ================= APROBAR ================= */
async function aprobar(id){
  const res = await fetch("/api/aprobar",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ id, adminKey: ADMIN_KEY })
  });

  const data = await res.json();
  alert(data.msg);
  cargarSolicitudes();
}

/* ================= RECHAZAR ================= */
async function rechazar(id){
  const res = await fetch("/api/rechazar",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ id, adminKey: ADMIN_KEY })
  });

  const data = await res.json();
  alert(data.msg);
  cargarSolicitudes();
}

function salir(){
  localStorage.clear();
  window.location.href = "/";
}

cargarSolicitudes();
</script>

</body>
</html>
