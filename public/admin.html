<!DOCTYPE html>

<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BITUSDT ADMIN</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#000428,#004e92);
color:white;
padding:20px;
}

.container{
max-width:1100px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{
color:#00ffcc;
margin:0;
}

.sub{
opacity:.8;
font-size:14px;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-bottom:20px;
}

.stat-card{
background:#111827;
padding:15px;
border-radius:10px;
text-align:center;
}

.stat-card h3{
margin:5px 0;
color:#00ffcc;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
background:#111827;
border-radius:10px;
overflow:hidden;
}

th, td{
padding:10px;
text-align:center;
border-bottom:1px solid #333;
}

th{
background:#1f2937;
}

button{
padding:6px 10px;
border:none;
border-radius:6px;
cursor:pointer;
color:white;
}

.btn-ok{ background:#22c55e; }
.btn-no{ background:#ef4444; }
.btn-edit{ background:#3b82f6; }

.btn-red{
background:#ef4444;
margin-top:20px;
width:100%;
padding:12px;
font-size:16px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
<h1>BITUSDT ADMIN</h1>
<div class="sub">Panel de control</div>
</div>

<div class="stats">

<div class="stat-card">
<h3 id="totalUsuarios">0</h3>
Usuarios
</div>

<div class="stat-card">
<h3 id="totalSolicitudes">0</h3>
Solicitudes pendientes
</div>

</div>

<h2>Solicitudes</h2>

<table>

<thead>
<tr>
<th>Email</th>
<th>Tipo</th>
<th>Monto</th>
<th>Nequi</th>
<th>Acción</th>
</tr>
</thead>

<tbody id="tablaSolicitudes"></tbody>

</table>

<h2>Usuarios</h2>

<table>

<thead>
<tr>
<th>Email</th>
<th>Saldo</th>
<th>Días</th>
<th>Nequi</th>
<th>Acción</th>
</tr>
</thead>

<tbody id="tablaUsuarios"></tbody>

</table>

<button class="btn-red" onclick="salir()">Cerrar sesión</button>

</div>

<script>

const usuario = JSON.parse(localStorage.getItem("usuario"));

if(!usuario || usuario.rol !== "admin"){
window.location.href="/";
}

const ADMIN_KEY="ADMIN123";


async function cargarSolicitudes(){

const res = await fetch("/api/solicitudes");
const data = await res.json();

document.getElementById("totalSolicitudes").innerText = data.length;

const tabla = document.getElementById("tablaSolicitudes");
tabla.innerHTML="";

if(data.length===0){

tabla.innerHTML=`
<tr>
<td colspan="5">No hay solicitudes pendientes</td>
</tr>
`;

return;
}

data.forEach(s=>{

tabla.innerHTML += `
<tr>
<td>${s.email}</td>
<td>${s.tipo}</td>
<td>${s.monto} USDT</td>
<td>${s.nequi || "No registrado"}</td>
<td>
<button class="btn-ok" onclick="aprobar('${s._id}')">✅</button>
<button class="btn-no" onclick="rechazar('${s._id}')">❌</button>
</td>
</tr>
`;

});

}


async function cargarUsuarios(){

const res = await fetch("/api/usuarios");
const data = await res.json();

document.getElementById("totalUsuarios").innerText = data.length;

const tabla=document.getElementById("tablaUsuarios");

tabla.innerHTML="";

data.forEach(u=>{

tabla.innerHTML += `
<tr>
<td>${u.email}</td>
<td>${u.saldo} USDT</td>
<td>${u.dias || 0}</td>
<td>${u.nequi || "No registrado"}</td>
<td>

<button class="btn-edit" onclick="editarSaldo('${u.email}')">✏️</button>

<button class="btn-no" onclick="eliminarUsuario('${u.email}')">❌</button>

</td>
</tr>
`;

});

}


async function editarSaldo(email){

const nuevo = prompt("Nuevo saldo para " + email);

if(nuevo===null) return;

const res = await fetch("/api/modificar-saldo",{

method:"POST",

headers:{ "Content-Type":"application/json" },

body:JSON.stringify({
email:email,
monto:nuevo
})

});

const data = await res.json();

alert(data.msg);

cargarUsuarios();

}


function eliminarUsuario(email){

if(!confirm("¿Seguro que deseas eliminar este usuario?")){
return;
}

fetch("/api/eliminar-usuario",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
email:email
})
})
.then(r=>r.json())
.then(d=>{

alert(d.msg);

if(d.ok){
cargarUsuarios();
}

});

}


async function aprobar(id){

const res = await fetch("/api/aprobar",{

method:"POST",

headers:{ "Content-Type":"application/json" },

body:JSON.stringify({
id:id,
adminKey:ADMIN_KEY
})

});

const data = await res.json();

alert(data.msg);

cargarSolicitudes();
cargarUsuarios();

}


async function rechazar(id){

const res = await fetch("/api/rechazar",{

method:"POST",

headers:{ "Content-Type":"application/json" },

body:JSON.stringify({
id:id,
adminKey:ADMIN_KEY
})

});

const data = await res.json();

alert(data.msg);

cargarSolicitudes();

}


function salir(){

localStorage.clear();

window.location.href="/";

}


cargarSolicitudes();
cargarUsuarios();

</script>

</body>
</html>
