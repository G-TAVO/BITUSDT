<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Préstamos Tavo</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}
.container{
max-width:700px;
margin:auto;
padding:20px;
padding-bottom:80px;
}
h1{
text-align:center;
color:#00ffcc;
margin-top:0;
}
h2{
margin-top:30px;
font-size:20px;
color:#38bdf8;
}
.card{
background:#1e293b;
padding:15px;
border-radius:12px;
margin-top:15px;
}
button{
padding:10px;
border:none;
border-radius:8px;
margin:5px;
cursor:pointer;
color:white;
font-weight:bold;
}
.aprobar{background:#22c55e;}
.rechazar{background:#ef4444;}
.bloquear{background:#f97316;}
.desbloquear{background:#3b82f6;}
.salir{
background:#ef4444;
width:100%;
padding:12px;
margin-top:25px;
}
small{
opacity:.8;
}
.top{
background:#111827;
padding:15px;
border-radius:12px;
margin-bottom:20px;
text-align:center;
}
</style>
</head>

<body>

<div class="container">

<h1>👑 PANEL ADMIN</h1>

<div class="top">
Sistema activo • Auto actualización cada 10 segundos
</div>

<!-- SOLICITUDES -->
<h2>📥 Solicitudes de Préstamo</h2>
<div id="solicitudes">Cargando...</div>

<!-- PAGOS -->
<h2>💰 Pagos Pendientes</h2>
<div id="pagos">Cargando...</div>

<!-- USUARIOS -->
<h2>👥 Usuarios Registrados</h2>
<div id="usuarios">Cargando...</div>

<button class="salir" onclick="salir()">Cerrar sesión</button>

</div>

<script>

// ========================
// VALIDAR ADMIN
// ========================
const usuario = JSON.parse(localStorage.getItem("usuario"));

if(!usuario || usuario.rol !== "admin"){
alert("Acceso denegado");
location.href="/";
}

// ========================
cargarTodo();

function cargarTodo(){
cargarSolicitudes();
cargarPagos();
cargarUsuarios();
}

// ========================
// SOLICITUDES
// ========================
async function cargarSolicitudes(){

const res = await fetch("/api/solicitudes");
const data = await res.json();

const box = document.getElementById("solicitudes");

if(data.length === 0){
box.innerHTML = "No hay solicitudes";
return;
}

box.innerHTML = "";

data.forEach(s=>{

box.innerHTML += `
<div class="card">
<b>${s.nombre}</b><br>
${s.email}<br>
Monto: $${s.monto}<br>
Cuotas: ${s.cuotas || 4}<br><br>

<button class="aprobar" onclick="aprobarPrestamo('${s._id}')">Aprobar</button>
<button class="rechazar" onclick="rechazarPrestamo('${s._id}')">Rechazar</button>
</div>
`;

});

}

async function aprobarPrestamo(id){

if(!confirm("¿Aprobar préstamo?")) return;

const res = await fetch("/api/aprobar",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({ id })
});

const data = await res.json();

alert(data.msg);

cargarTodo();

}

async function rechazarPrestamo(id){

if(!confirm("¿Rechazar solicitud?")) return;

const res = await fetch("/api/rechazar",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({ id })
});

const data = await res.json();

alert(data.msg);

cargarSolicitudes();

}

// ========================
// PAGOS
// ========================
async function cargarPagos(){

const res = await fetch("/api/pagos");
const data = await res.json();

const box = document.getElementById("pagos");

if(data.length === 0){
box.innerHTML = "No hay pagos pendientes";
return;
}

box.innerHTML = "";

data.forEach(p=>{

box.innerHTML += `
<div class="card">
<b>${p.nombre}</b><br>
${p.email}<br>
Valor: $${p.valor}<br>
<small>${p.fecha}</small><br><br>

<button class="aprobar" onclick="aprobarPago('${p._id}')">Confirmar Pago</button>
<button class="rechazar" onclick="rechazarPago('${p._id}')">Rechazar</button>
</div>
`;

});

}

async function aprobarPago(id){

if(!confirm("¿Confirmar pago recibido?")) return;

const res = await fetch("/api/aprobar-pago",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({ id })
});

const data = await res.json();

alert(data.msg);

cargarTodo();

}

async function rechazarPago(id){

if(!confirm("¿Rechazar este pago?")) return;

const res = await fetch("/api/rechazar-pago",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({ id })
});

const data = await res.json();

alert(data.msg);

cargarPagos();

}

// ========================
// USUARIOS
// ========================
async function cargarUsuarios(){

const res = await fetch("/api/usuarios");
const data = await res.json();

const box = document.getElementById("usuarios");

if(data.length === 0){
box.innerHTML = "No hay usuarios";
return;
}

box.innerHTML = "";

data.forEach(u=>{

box.innerHTML += `
<div class="card">
<b>${u.nombre}</b><br>
${u.email}<br>

Saldo:
<span style="color:${u.saldo>0?'#f87171':'#22c55e'}">
$${u.saldo}
</span><br>

Cuotas: ${u.cuotasPagadas}/${u.cuotasTotal}<br>

Estado:
${u.bloqueado ? "🚫 Bloqueado" : "✅ Activo"}
<br><br>

${
u.bloqueado
?
`<button class="desbloquear" onclick="desbloquear('${u.email}')">Desbloquear</button>`
:
`<button class="bloquear" onclick="bloquear('${u.email}')">Bloquear</button>`
}

</div>
`;

});

}

async function bloquear(email){

const res = await fetch("/api/bloquear",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({ email })
});

const data = await res.json();

alert(data.msg);

cargarUsuarios();

}

async function desbloquear(email){

const res = await fetch("/api/desbloquear",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({ email })
});

const data = await res.json();

alert(data.msg);

cargarUsuarios();

}

// ========================
function salir(){
localStorage.removeItem("usuario");
location.href="/";
}

// AUTO REFRESCO
setInterval(cargarTodo,10000);

</script>

</body>
</html>
