<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Préstamos Tavo</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#000428,#004e92);
  color:white;
  padding:20px;
}
.container{
  max-width:900px;
  margin:auto;
}
h1,h2{
  text-align:center;
  color:#00ffcc;
}
.card{
  background:#111827;
  padding:15px;
  border-radius:10px;
  margin-bottom:20px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
th,td{
  padding:10px;
  border-bottom:1px solid #333;
  text-align:center;
}
.btn{
  padding:6px 10px;
  border:none;
  border-radius:5px;
  cursor:pointer;
}
.aprobar{ background:#22c55e; color:white; }
.rechazar{ background:#ef4444; color:white; }
</style>
</head>

<body>

<div class="container">

<h1>PANEL ADMIN</h1>

<div class="card">
<h2>Solicitudes de préstamo</h2>

<table>
<thead>
<tr>
<th>Nombre</th>
<th>Email</th>
<th>Monto</th>
<th>Acción</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

</div>

<button onclick="salir()" style="background:red;width:100%;padding:10px;border:none;color:white;">Cerrar sesión</button>

</div>

<script>

const usuario = JSON.parse(localStorage.getItem("usuario"));
if(!usuario || usuario.rol !== "admin"){
  window.location.href="/";
}

/* CARGAR SOLICITUDES */
async function cargar(){

  const res = await fetch("/api/solicitudes");
  const data = await res.json();

  const tabla = document.getElementById("tabla");
  tabla.innerHTML = "";

  if(data.length === 0){
    tabla.innerHTML = "<tr><td colspan='4'>Sin solicitudes</td></tr>";
    return;
  }

  data.forEach(s=>{
    tabla.innerHTML += `
      <tr>
        <td>${s.nombre}</td>
        <td>${s.email}</td>
        <td>$${s.monto}</td>
        <td>
          <button class="btn aprobar" onclick="aprobar('${s._id}')">Aprobar</button>
          <button class="btn rechazar" onclick="rechazar('${s._id}')">Rechazar</button>
        </td>
      </tr>
    `;
  });
}

/* APROBAR */
async function aprobar(id){

  const res = await fetch("/api/aprobar",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ id })
  });

  const data = await res.json();
  alert(data.msg);
  cargar();
}

/* RECHAZAR */
async function rechazar(id){

  const res = await fetch("/api/rechazar",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ id })
  });

  const data = await res.json();
  alert(data.msg);
  cargar();
}

/* SALIR */
function salir(){
  localStorage.clear();
  window.location.href="/";
}

cargar();

</script>

</body>
</html>
