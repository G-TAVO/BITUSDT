<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BITUSDT</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',Arial;
  background:linear-gradient(135deg,#020617,#0f172a);
  color:white;
}

.auth-wrapper{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  background:#020617cc;
  margin:10px;
  padding:18px;
  border-radius:16px;
  box-shadow:0 0 20px #000;
  width:100%;
  max-width:420px;
}

h3{
  margin-top:0;
  color:#22c55e;
  text-align:center;
}

input{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid #1e293b;
  font-size:15px;
  background:#020617;
  color:white;
}

button{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:12px;
  border:none;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{opacity:.9}
.hide{display:none}

small{
  cursor:pointer;
  color:#22c55e;
  display:block;
  text-align:center;
  margin-top:8px;
}

hr{border:1px solid #1e293b;margin:18px 0}

.menu-botones{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.btn-invertir{background:linear-gradient(135deg,#22c55e,#16a34a);color:#052e16;}
.btn-wallet{background:linear-gradient(135deg,#38bdf8,#2563eb);color:white;}
.btn-retirar{background:linear-gradient(135deg,#fb923c,#f97316);color:#431407;}
.btn-whatsapp{background:linear-gradient(135deg,#a855f7,#7c3aed);color:white;}
.btn-salir{background:#ef4444;color:white;}

.contact{
  margin-top:15px;
  padding:12px;
  background:#020617;
  border-radius:12px;
  text-align:center;
  font-size:14px;
}
</style>
</head>

<body>

<div class="auth-wrapper">

  <!-- LOGIN -->
  <div class="card" id="loginBox">
    <h3>LOGIN</h3>

    <input id="l_email" type="email" placeholder="Correo">
    <input id="l_pass" type="password" placeholder="Contraseña">

    <label style="font-size:13px">
      <input type="checkbox" id="terminos">
      Acepto términos y condiciones
    </label>

    <button class="btn-invertir" onclick="login()">Entrar</button>

    <p id="loginMsg" style="color:#ef4444;text-align:center;"></p>

    <small onclick="mostrarRegistro()">Crear cuenta</small>
  </div>

  <!-- REGISTRO -->
  <div class="card hide" id="registerBox">
    <h3>REGISTRO</h3>

    <input id="r_nombre" placeholder="Nombre completo">
    <input id="r_email" type="email" placeholder="Correo">
    <input id="r_pass" type="password" placeholder="Contraseña">

    <button class="btn-wallet" onclick="register()">Registrar</button>
    <button class="btn-retirar" onclick="volverLogin()">Volver</button>

    <p id="msg" style="text-align:center;"></p>
  </div>

</div>

<!-- PANEL USUARIO -->
<div class="card hide" id="panel">

<h3 id="tituloPanel">Panel Usuario</h3>

<p>
👤 <b id="nombreUser"></b><br>
SALDO: <b id="saldo">0</b> USDT
</p>

<p>DÍA: <b id="dia">0</b>/15</p>
<p>GANANCIA DIARIA: <b>0.5 USDT</b></p>

<input id="monto" type="number" min="1" placeholder="Monto a invertir">

<button class="btn-wallet" onclick="editarNombre()">Editar Nombre</button>

<div class="menu-botones">
  <button class="btn-invertir" onclick="invertir()">Invertir</button>
  <button class="btn-wallet" onclick="agregarWallet()">Agregar billetera</button>
  <button class="btn-retirar" onclick="retirar()">Retirar</button>
  <button class="btn-whatsapp" onclick="invitar()">WhatsApp</button>
</div>

<button class="btn-salir" onclick="logout()">Salir</button>

<div class="contact">
📧 <b>Soporte oficial</b><br>
Sistema educativo BITUSDT
</div>

</div>

<script src="script.js"></script>

</body>
</html>
