<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro | Préstamos Tavo</title>

<style>
body{
  font-family: Arial;
  background:#0f172a;
  color:white;
  margin:0;
}
.container{
  max-width:400px;
  margin:auto;
  padding:20px;
  margin-top:20px;
}
.card{
  background:#1e293b;
  padding:20px;
  border-radius:12px;
}
input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:none;
  margin-top:10px;
}
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin-top:10px;
  font-weight:bold;
  cursor:pointer;
}
.btn{
  background:#22c55e;
  color:white;
}
.btn2{
  background:#3b82f6;
  color:white;
}
.switch{
  text-align:center;
  margin-top:10px;
  cursor:pointer;
  color:#00ffcc;
}
</style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div class="card" id="loginBox">
    <h2>Iniciar Sesión</h2>

    <input type="email" id="loginEmail" placeholder="Correo">
    <input type="password" id="loginPass" placeholder="Contraseña">

    <button class="btn2" onclick="login()">Entrar</button>

    <div class="switch" onclick="mostrarRegistro()">
      ¿No tienes cuenta? Regístrate
    </div>
  </div>

  <!-- REGISTRO COMPLETO -->
  <div class="card" id="registroBox" style="display:none">
    <h2>Crear Cuenta</h2>

    <input type="text" id="regNombre" placeholder="Nombre completo">
    <input type="text" id="regCedula" placeholder="Cédula">
    <input type="text" id="regTelefono" placeholder="Teléfono">
    <input type="text" id="regWhats" placeholder="WhatsApp">
    <input type="email" id="regEmail" placeholder="Correo">
    <input type="password" id="regPass" placeholder="Contraseña">

    <button class="btn" onclick="registro()">Crear cuenta</button>

    <div class="switch" onclick="mostrarLogin()">
      Ya tengo cuenta
    </div>
  </div>

</div>

<script>

/* CAMBIAR VISTAS */
function mostrarRegistro(){
  loginBox.style.display="none";
  registroBox.style.display="block";
}

function mostrarLogin(){
  loginBox.style.display="block";
  registroBox.style.display="none";
}

/* LOGIN */
async function login(){
  const email = loginEmail.value;
  const password = loginPass.value;

  const res = await fetch("/api/login",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({email,password})
  });

  const data = await res.json();

  if(data.usuario){
    localStorage.setItem("usuario", JSON.stringify(data.usuario));
    window.location.href="/panel.html";
  }else{
    alert(data.msg);
  }
}

/* REGISTRO NUEVO (CON TODOS LOS CAMPOS) */
async function registro(){

  const nombre = regNombre.value.trim();
  const cedula = regCedula.value.trim();
  const telefono = regTelefono.value.trim();
  const whatsapp = regWhats.value.trim();
  const email = regEmail.value.trim();
  const password = regPass.value.trim();

  if(!nombre || !cedula || !telefono || !whatsapp || !email || !password){
    alert("Todos los campos son obligatorios");
    return;
  }

  const res = await fetch("/api/register",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ nombre, cedula, telefono, whatsapp, email, password })
  });

  const data = await res.json();

  alert(data.msg);

  if(data.ok){
    mostrarLogin();
  }
}

</script>

</body>
</html>
