<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Préstamos Tavo</title>

<style>
body{
  font-family: Arial;
  background:#0f172a;
  color:white;
  margin:0;
}

header{
  background:#020617;
  padding:15px;
  text-align:center;
  font-size:20px;
  color:#00ffcc;
}

.container{
  max-width:400px;
  margin:auto;
  padding:20px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
}

input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:none;
  margin-top:10px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin-top:10px;
  font-weight:bold;
  cursor:pointer;
}

.btn{
  background:#22c55e;
  color:white;
}

.btn2{
  background:#3b82f6;
  color:white;
}

.btn3{
  background:#25D366;
  color:white;
}

.switch{
  text-align:center;
  margin-top:10px;
  cursor:pointer;
  color:#00ffcc;
}

.modal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
}

.modal-content{
  background:white;
  color:black;
  margin:50px auto;
  padding:20px;
  width:90%;
  max-width:400px;
  border-radius:10px;
}

.close{
  float:right;
  cursor:pointer;
  font-size:20px;
}
</style>
</head>

<body>

<header>💳 PRÉSTAMOS TAVO</header>

<div class="container">

  <!-- LOGIN -->
  <div class="card" id="loginBox">
    <h2>Iniciar Sesión</h2>

    <input type="email" id="loginEmail" placeholder="Correo">
    <input type="password" id="loginPass" placeholder="Contraseña">

    <button class="btn2" onclick="login()">Entrar</button>

    <div class="switch" onclick="mostrarRegistro()">
      ¿No tienes cuenta? Regístrate
    </div>
  </div>

  <!-- REGISTRO -->
  <div class="card" id="registroBox" style="display:none">
    <h2>Registrarse</h2>

    <input type="email" id="regEmail" placeholder="Correo">
    <input type="password" id="regPass" placeholder="Contraseña">

    <label style="font-size:13px;">
      <input type="checkbox" id="terms">
      Acepto términos y condiciones
    </label>

    <button onclick="abrirModal()">Ver términos</button>

    <button class="btn" onclick="registro()">Crear cuenta</button>

    <div class="switch" onclick="mostrarLogin()">
      Ya tengo cuenta
    </div>
  </div>

  <!-- COMPARTIR -->
  <div class="card">
    <h3>Compartir App</h3>

    <button class="btn3" onclick="compartirWhatsApp()">
      Compartir por WhatsApp
    </button>

    <button class="btn2" onclick="copiarLink()">
      Copiar enlace
    </button>
  </div>

</div>

<!-- MODAL TERMINOS -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="cerrarModal()">✖</span>

    <h3>Términos y Condiciones</h3>

    <p>Préstamos desde $50.000 hasta $500.000.</p>
    <p>Interés del 10% mensual.</p>
    <p>Pagos cada 8 días.</p>
    <p>Debes registrar datos reales.</p>
    <p>El incumplimiento puede generar reporte.</p>

  </div>
</div>

<script>

/* CAMBIAR VISTAS */
function mostrarRegistro(){
  loginBox.style.display="none";
  registroBox.style.display="block";
}

function mostrarLogin(){
  loginBox.style.display="block";
  registroBox.style.display="none";
}

/* LOGIN */
async function login(){
  const email = loginEmail.value;
  const password = loginPass.value;

  const res = await fetch("/api/login",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({email,password})
  });

  const data = await res.json();

  if(data.usuario){
    localStorage.setItem("usuario", JSON.stringify(data.usuario));
    window.location.href="/panel.html";
  }else{
    alert(data.msg);
  }
}

/* REGISTRO */
async function registro(){

  const email = regEmail.value;
  const password = regPass.value;
  const terms = document.getElementById("terms").checked;

  if(!terms){
    alert("Debes aceptar los términos");
    return;
  }

  const res = await fetch("/api/register",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({email,password})
  });

  const data = await res.json();
  alert(data.msg);

  if(data.ok){
    mostrarLogin();
  }
}

/* WHATSAPP NORMAL Y BUSINESS */
function compartirWhatsApp(){

  const link = window.location.origin;

  const mensaje = `💰 Préstamos rápidos desde tu celular\nFácil y seguro 👇\n${link}`;

  const url = "https://api.whatsapp.com/send?text=" + encodeURIComponent(mensaje);

  window.open(url, "_blank");
}

/* COPIAR LINK */
function copiarLink(){
  const link = window.location.origin;
  navigator.clipboard.writeText(link);
  alert("Link copiado ✅");
}

/* MODAL */
function abrirModal(){
  document.getElementById("modal").style.display="block";
}

function cerrarModal(){
  document.getElementById("modal").style.display="none";
}

</script>

</body>
</html>
