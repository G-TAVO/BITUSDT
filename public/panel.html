<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRÉSTAMOS TAVO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}
.container{
  max-width:500px;
  margin:auto;
  padding:20px;
  padding-bottom:90px;
}
.header{
  text-align:center;
  margin-bottom:20px;
}
.header h1{
  margin:0;
  color:#00ffcc;
}
.nombre{
  margin-top:5px;
  font-size:14px;
  opacity:.8;
}

.saldo-card{
  background:linear-gradient(135deg,#2563eb,#1e40af);
  padding:25px;
  border-radius:15px;
  text-align:center;
}
.saldo{
  font-size:32px;
  font-weight:bold;
  margin-top:10px;
}

.card{
  background:#1e293b;
  padding:15px;
  border-radius:12px;
  margin-top:20px;
}

input,select{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:none;
  margin-top:10px;
}

button{
  padding:14px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  color:white;
  font-size:15px;
  width:100%;
  margin-top:10px;
}

.btn-green{ background:#22c55e }
.btn-blue{ background:#3b82f6 }
.btn-orange{ background:#f97316 }
.btn-red{ background:#ef4444 }
.btn-purple{ background:#8b5cf6 }

.menu{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111827;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
}
.menu button{
  background:none;
  border:none;
  color:white;
}

.historial-item{
  margin:5px 0;
  padding:8px;
  background:#0f172a;
  border-radius:8px;
}
</style>

</head>

<body>

<div class="container">

<div class="header">
<h1>PRÉSTAMOS TAVO</h1>
<div class="nombre" id="nombreUsuario"></div>
</div>

<div class="saldo-card">
<p>Deuda actual</p>
<div class="saldo">$<span id="saldo">0</span></div>
<p>Total a pagar: $<span id="totalPagar">0</span></p>
<p>Días restantes: <span id="dias">0</span></p>
<p>Préstamo activo: <span id="prestamoEstado">No</span></p>
</div>

<!-- PRESTAMO -->
<div class="card">
<h3>Solicitar préstamo</h3>

<input type="number" id="monto" placeholder="Ej: 50000">

<select id="cuotas">
<option value="2">2 cuotas</option>
<option value="3">3 cuotas</option>
<option value="4" selected>4 cuotas</option>
<option value="5">5 cuotas</option>
<option value="6">6 cuotas</option>
</select>

<button class="btn-green" onclick="solicitarPrestamo()">Solicitar</button>
</div>

<!-- PAGAR -->
<div class="card">
<h3>Pagar préstamo</h3>
<p>Cuota actual: $<span id="valorCuota">0</span></p>

<button class="btn-purple" onclick="pagarNequi()">
Pagar por Nequi
</button>
</div>

<!-- NEQUI -->
<div class="card">
<h3>Cuenta de retiro</h3>
<p>Nequi: <span id="nequi">No registrado</span></p>
<button class="btn-blue" onclick="agregarNequi()">Registrar Nequi</button>
</div>

<!-- HISTORIAL -->
<div class="card">
<h3>Historial</h3>
<div id="historial">Cargando...</div>
</div>

<!-- SOPORTE -->
<div class="card">
<h3>Soporte</h3>
<a href="https://wa.me/573012245428" target="_blank">
<button class="btn-orange">Contactar</button>
</a>
</div>

</div>

<div class="menu">
<button onclick="window.scrollTo(0,0)">Inicio</button>
<button onclick="salir()">Salir</button>
</div>

<script>

// ====================== LOGIN ======================
let usuario = localStorage.getItem("usuario");

if(!usuario){
 alert("Debes iniciar sesión");
 location.href="/";
}else{
 usuario = JSON.parse(usuario);
}

// ====================== DATOS ======================
document.getElementById("nombreUsuario").innerText =
"👤 " + (usuario.nombre || "Usuario");

document.getElementById("saldo").innerText = usuario.saldo || 0;
document.getElementById("dias").innerText = usuario.dias || 0;
document.getElementById("nequi").innerText = usuario.nequi || "No registrado";

document.getElementById("prestamoEstado").innerText =
usuario.saldo > 0 ? "Sí" : "No";

calcularPago();

// ====================== CALCULO ======================
function calcularPago(){

let deuda = Number(usuario.saldo || 0);

if(deuda <= 0){
 document.getElementById("totalPagar").innerText = 0;
 document.getElementById("valorCuota").innerText = 0;
 return;
}

// 10% interés bajo
let total = Math.round(deuda * 1.10);

// cuotas guardadas
let cuotas = Number(usuario.cuotas || 4);

let valor = Math.round(total / cuotas);

document.getElementById("totalPagar").innerText = total;
document.getElementById("valorCuota").innerText = valor;

}

// ====================== SOLICITAR ======================
async function solicitarPrestamo(){

let monto = Number(document.getElementById("monto").value);
let cuotas = Number(document.getElementById("cuotas").value);

if(!monto || monto < 50000){
 alert("Monto mínimo 50.000");
 return;
}

const res = await fetch("/api/solicitar-prestamo",{
 method:"POST",
 headers:{ "Content-Type":"application/json" },
 body:JSON.stringify({
   email:usuario.email,
   monto,
   cuotas
 })
});

const data = await res.json();

if(data.ok){

 alert("Solicitud enviada al administrador");

 usuario.saldo = monto;
 usuario.dias = 30;
 usuario.cuotas = cuotas;

 localStorage.setItem("usuario",JSON.stringify(usuario));

 location.reload();

}else{
 alert(data.msg);
}

}

// ====================== PAGAR NEQUI ======================
function pagarNequi(){

if((usuario.saldo || 0) <= 0){
 alert("No tienes deuda");
 return;
}

let deuda = Number(usuario.saldo);
let total = Math.round(deuda * 1.10);
let cuotas = Number(usuario.cuotas || 4);
let valor = Math.round(total / cuotas);

let numero = "3012245428";

let texto =
"Hola, deseo pagar una cuota de $" + valor +
" de mi préstamo en PRÉSTAMOS TAVO. Usuario: " +
usuario.nombre;

window.open(
"https://wa.me/57"+numero+"?text="+encodeURIComponent(texto),
"_blank"
);

}

// ====================== NEQUI ======================
async function agregarNequi(){

let numero = prompt("Ingresa tu número Nequi:");

if(!numero) return;

const res = await fetch("/api/nequi",{
 method:"POST",
 headers:{ "Content-Type":"application/json" },
 body:JSON.stringify({
   email:usuario.email,
   nequi:numero
 })
});

const data = await res.json();

if(data.ok){
 usuario.nequi = numero;
 localStorage.setItem("usuario",JSON.stringify(usuario));
 location.reload();
}

}

// ====================== HISTORIAL ======================
async function historial(){

const res = await fetch("/api/historial-prestamos/"+usuario.email);
const data = await res.json();

const cont = document.getElementById("historial");

if(data.length === 0){
 cont.innerHTML = "Sin movimientos";
 return;
}

cont.innerHTML = "";

data.forEach(h=>{
 cont.innerHTML += `
 <div class="historial-item">
 ${h.fecha} - $${h.monto}
 </div>`;
});

}

historial();

// ====================== SALIR ======================
function salir(){
localStorage.removeItem("usuario");
location.href="/";
}

</script>

</body>
</html>
