<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Usuario</title>
  <div class="card">
  <h3>⚙ Configuración</h3>

  <input type="text" id="editNombre" placeholder="Editar nombre">
  <input type="email" id="editEmail" placeholder="Editar correo">
  <input type="tel" id="editTelefono" placeholder="Editar teléfono">
  <input type="text" id="editWallet" placeholder="Editar billetera">

  <button class="btn-purple" onclick="actualizarPerfil()">Guardar Cambios</button>
  </div>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000428">
<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:white;
  padding:20px;
}

.container{
  max-width:500px;
  margin:auto;
  background:#111827;
  padding:20px;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.6);
}

h2{
  text-align:center;
  color:#00ffcc;
}

.card{
  background:#1f2937;
  padding:15px;
  border-radius:10px;
  margin:15px 0;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  margin-top:10px;
  font-weight:bold;
  cursor:pointer;
  color:white;
}

.btn-green{ background:#22c55e; }
.btn-orange{ background:#f97316; }
.btn-blue{ background:#3b82f6; }
.btn-purple{ background:#9333ea; }
.btn-red{ background:#ef4444; }
.btn-menu{ background:#00c896; }

input{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  margin-top:10px;
}

.footer{
  text-align:center;
  margin-top:20px;
  font-size:14px;
  opacity:.8;
}

/* MENÚ DESPLEGABLE */
.menu-acciones{
  display:none;
  margin-top:10px;
  animation: slideDown .3s ease;
}

@keyframes slideDown{
  from{ opacity:0; transform:translateY(-6px); }
  to{ opacity:1; transform:translateY(0); }
}
</style>
</head>

<body>

<div class="container">

<h2>Panel Usuario</h2>

<div class="card">
  <p><b>Billetera registrada:</b></p>
  <p id="walletDeposito">No registrada</p>
  <button class="btn-blue" onclick="copiar()">Copiar billetera</button>
</div>

<div class="card">
  <p><b>Saldo:</b> <span id="saldo">0</span> USDT</p>
  <p><b>Ganancia diaria:</b> 5%</p>
</div>

<div class="card">

  <input type="number" id="monto" placeholder="Monto a invertir">

  <!-- BOTÓN MENÚ -->
  <button class="btn-menu" onclick="toggleMenu()">☰ Menú de acciones</button>

  <!-- MENÚ -->
  <div id="menuAcciones" class="menu-acciones">
<button class="btn-green" onclick="depositar(); cerrarMenu()">
  💰 Depositar
</button>
    <button class="btn-green" onclick="invertir(); cerrarMenu()">Invertir</button>

    <button class="btn-orange" onclick="retirar(); cerrarMenu()">Retirar</button>

    <button class="btn-purple" onclick="guardarWallet(); cerrarMenu()">Agregar / Cambiar billetera</button>

    <button class="btn-blue" onclick="compartirWhatsApp(); cerrarMenu()">
  📲 Invitar Amigos
</button>

    <button class="btn-red" onclick="salir()">Salir</button>
<button id="btnInstalar" style="display:none;">
  📲 Descargar App
</button>
  </div>

</div>

<div class="footer">
📩 Binancecoin958@gmail.com
</div>

</div>
<!-- MODAL DE DEPOSITO -->
<div id="modalDeposito" class="modal">
  <div class="modal-content">
    <h3>💰 Depositar USDT</h3>

    <p>Envía el dinero a esta billetera:</p>

    <div class="wallet-box" id="walletAdmin">
      TXDiTXnPUV3th3rHtZaX4XqzdJeVLbJeVo
    </div>

    <p><strong>Red:</strong> TRC20 (TRON)</p>
    <p>⚠️ Envía exactamente el monto que vas a invertir.</p>

    <button onclick="copiarWallet()">Copiar Dirección</button>
    <button onclick="confirmarDeposito()">Confirmar depósito</button>
    <button onclick="cerrarDeposito()">Cerrar</button>
  </div>
</div>
<script>
const usuario = JSON.parse(localStorage.getItem("usuario"));
if(!usuario) window.location.href="/";

/* ===== MENÚ ===== */
function toggleMenu(){
  const menu = document.getElementById("menuAcciones");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
}

function cerrarMenu(){
  document.getElementById("menuAcciones").style.display = "none";
}

/* ===== CARGAR DATOS ===== */
document.getElementById("saldo").innerText = usuario.saldo || 0;
document.getElementById("walletDeposito").innerText =
  usuario.wallet && usuario.wallet !== "" ? usuario.wallet : "No registrada";

/* ===== COPIAR WALLET ===== */
function copiar(){
  if(!usuario.wallet){
    alert("No tienes billetera registrada");
    return;
  }
  navigator.clipboard.writeText(usuario.wallet);
  alert("Billetera copiada");
}

/* ===== INVERTIR ===== */
async function invertir(){
  const monto = document.getElementById("monto").value;
  console.log("Email enviado:", usuario.email);
  if(!monto || monto <= 0){
    alert("Ingresa un monto válido");
    return;
  }

  const res = await fetch("/api/invertir",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      email: usuario.email,
      monto
    })
  });

  const data = await res.json();
  alert(data.msg || "Solicitud enviada");
}

/* ===== RETIRAR (PROTEGIDO) ===== */
async function retirar(){
  if(!usuario.wallet){
    alert("Debes registrar una billetera primero");
    return;
  }

  const res = await fetch("/api/retirar",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ email: usuario.email })
  });

  const data = await res.json();
  alert(data.msg || "Solicitud enviada");
}

/* ===== GUARDAR WALLET ===== */
async function guardarWallet(){
  const w = prompt("Ingresa tu billetera (TRC20 / Nequi):");
  if(!w){
    alert("Billetera no válida");
    return;
  }

  const res = await fetch("/api/wallet",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      email: usuario.email,
      wallet: w
    })
  });

  const data = await res.json();
  alert(data.msg || "Billetera guardada");

  usuario.wallet = w;
  localStorage.setItem("usuario", JSON.stringify(usuario));
  document.getElementById("walletDeposito").innerText = w;
}

/* ===== WHATSAPP ===== */
function whatsapp(){
  window.open("https://wa.me/57XXXXXXXXXX","_blank");
}

/* ===== SALIR ===== */
function salir(){
  localStorage.clear();
  window.location.href="/";
}
  function abrirDeposito(){
  document.getElementById("modalDeposito").style.display = "block";
}

function cerrarDeposito(){
  document.getElementById("modalDeposito").style.display = "none";
}

function copiarWallet(){
  const wallet = document.getElementById("walletAdmin").innerText;
  navigator.clipboard.writeText(wallet);
  alert("Dirección copiada");
}

async function confirmarDeposito(){
  const monto = document.getElementById("monto").value;

  if(!monto || monto <= 0){
    alert("Ingresa el monto que depositaste");
    return;
  }

  const res = await fetch("/api/invertir",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      email: usuario.email,
      monto: Number(monto)
    })
  });

  const data = await res.json();
  alert("Depósito enviado a revisión");
  cerrarDeposito();
}
  function compartirWhatsApp(){
  const link = window.location.origin + "/register.html?ref=" + usuario.email;

  const mensaje =
    "🔥 Gana dinero invirtiendo desde casa.\n\n" +
    "Regístrate aquí 👇\n" + link;

  const url = "https://api.whatsapp.com/send?text=" + encodeURIComponent(mensaje);

  window.open(url, "_blank");
  }
  /* ===== INSTALAR PWA ===== */
let deferredPrompt;
const btnInstalar = document.getElementById("btnInstalar");

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  btnInstalar.style.display = "block";
});

btnInstalar.addEventListener("click", async () => {
  btnInstalar.style.display = "none";
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
});
</script>

</body>
</html>
