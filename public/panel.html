<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel Usuario</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000428">

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
padding:20px;
}

.container{
max-width:500px;
margin:auto;
background:#111827;
padding:20px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.6);
}

h2{
text-align:center;
color:#00ffcc;
}

.card{
background:#1f2937;
padding:15px;
border-radius:12px;
margin:15px 0;
}

.saldo{
font-size:28px;
font-weight:bold;
color:#00ffcc;
text-align:center;
margin-top:10px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
margin-top:10px;
font-weight:bold;
cursor:pointer;
color:white;
}

.btn-green{ background:#22c55e; }
.btn-orange{ background:#f97316; }
.btn-blue{ background:#3b82f6; }
.btn-purple{ background:#9333ea; }
.btn-red{ background:#ef4444; }

input{
width:100%;
padding:10px;
border-radius:8px;
border:none;
margin-top:10px;
}

.footer{
text-align:center;
margin-top:20px;
font-size:14px;
opacity:.8;
}

</style>

</head>

<body>

<div class="container">

<h2>BITUSDT</h2>

<!-- SALDO PRINCIPAL -->

<div class="card">

<p style="text-align:center">Saldo disponible</p>

<div class="saldo">
<span id="saldo">0</span> USDT
</div>

<p style="text-align:center;margin-top:10px">
Ganancia diaria: 5%
</p>

</div>


<!-- BILLETERA -->

<div class="card">

<p><b>Billetera registrada</b></p>

<p id="walletDeposito">No registrada</p>

<button class="btn-blue" onclick="copiar()">
Copiar billetera
</button>

</div>


<!-- ACCIONES PRINCIPALES -->

<div class="card">

<input type="number" id="monto" placeholder="Monto en USDT">

<button class="btn-green" onclick="invertir()">
Invertir
</button>

<button class="btn-orange" onclick="retirar()">
Retirar
</button>

<button class="btn-blue" onclick="mostrarDeposito()">
Depositar
</button>

<button class="btn-purple" onclick="compartirWhatsApp()">
Invitar Amigos
</button>

</div>


<!-- HISTORIAL -->

<div class="card">

<h3>📜 Historial</h3>

<div id="historial"></div>

</div>


<!-- CONFIGURACIÓN -->

<div class="card">

<h3>⚙ Configuración</h3>

<input type="text" id="editNombre" placeholder="Editar nombre">

<input type="email" id="editEmail" placeholder="Editar correo">

<input type="tel" id="editTelefono" placeholder="Editar teléfono">

<input type="text" id="editWallet" placeholder="Editar billetera">

<button class="btn-purple" onclick="actualizarPerfil()">
Guardar cambios
</button>

<button class="btn-red" onclick="salir()">
Cerrar sesión
</button>

<button id="btnInstalar" style="display:none">
📲 Descargar App
</button>

</div>

<div class="footer">
📩 Binancecoin958@gmail.com
</div>

</div>

<script>

/* TODO TU JAVASCRIPT ORIGINAL VA AQUÍ
   NO CAMBIES NADA DE LAS FUNCIONES
*/

</script>

</body>
</html>
