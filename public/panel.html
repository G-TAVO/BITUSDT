<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Usuario | Préstamos Tavo</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}
.container{
max-width:500px;
margin:auto;
padding:20px;
padding-bottom:90px;
}
.header{
text-align:center;
margin-bottom:20px;
}
.header h1{
margin:0;
color:#00ffcc;
}
.nombre{
margin-top:5px;
font-size:14px;
opacity:.8;
}
.card{
background:#1e293b;
padding:15px;
border-radius:12px;
margin-top:20px;
}
.saldo-card{
background:linear-gradient(135deg,#2563eb,#1e40af);
padding:25px;
border-radius:15px;
text-align:center;
}
.saldo{
font-size:32px;
font-weight:bold;
margin-top:10px;
}
input,select{
width:100%;
padding:12px;
border:none;
border-radius:8px;
margin-top:10px;
box-sizing:border-box;
}
button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
color:white;
margin-top:10px;
}
.btn-green{background:#22c55e;}
.btn-purple{background:#8b5cf6;}
.btn-blue{background:#3b82f6;}

.menu{
position:fixed;
bottom:0;
left:0;
right:0;
background:#111827;
display:flex;
justify-content:space-around;
padding:10px 0;
}
.menu button{
background:none;
border:none;
color:white;
width:auto;
margin:0;
}
.historial-item{
background:#0f172a;
padding:8px;
border-radius:8px;
margin-top:8px;
}
.info{
font-size:14px;
opacity:.8;
margin-top:6px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>PRÉSTAMOS TAVO</h1>
<div class="nombre" id="nombreUsuario"></div>
</div>

<div class="saldo-card">
<p>Deuda actual</p>
<div class="saldo">$<span id="saldo">0</span></div>
<p>Total a pagar: $<span id="totalPagar">0</span></p>
<p>Días restantes: <span id="dias">0</span></p>
<p>Préstamo activo: <span id="prestamoEstado">No</span></p>
<p>Cuotas pagadas: <span id="cuotasInfo">0/0</span></p>
</div>

<!-- HISTORIAL -->
<div class="card">
<h3>Historial</h3>

<button class="btn-blue" onclick="toggleHistorial()" id="btnHistorial">
Ver historial
</button>

<div id="historialBox" style="display:none; margin-top:10px;">
<div id="historial">Cargando...</div>
</div>

</div>

</div>

<div class="menu">
<button onclick="window.scrollTo(0,0)">Inicio</button>
<button onclick="salir()">Salir</button>
</div>

<script>

let usuario = JSON.parse(localStorage.getItem("usuario"));

if(!usuario){
alert("Debes iniciar sesión");
location.href="/";
}

pintar();

function pintar(){

document.getElementById("nombreUsuario").innerText="👤 "+usuario.nombre;
document.getElementById("saldo").innerText=usuario.saldo || 0;
document.getElementById("dias").innerText=usuario.dias || 0;

document.getElementById("prestamoEstado").innerText=
(usuario.saldo>0) ? "Sí" : "No";

document.getElementById("cuotasInfo").innerText=
(usuario.cuotasPagadas || 0)+"/"+(usuario.cuotasTotal || 0);

}

function toggleHistorial(){

const box = document.getElementById("historialBox");
const btn = document.getElementById("btnHistorial");

if(box.style.display === "none"){
box.style.display = "block";
btn.innerText = "Cerrar historial";
historial();
}else{
box.style.display = "none";
btn.innerText = "Ver historial";
}

}

async function historial(){

const res = await fetch("/api/historial-prestamos/"+usuario.email);
const data = await res.json();

const box = document.getElementById("historial");

if(data.length===0){
box.innerHTML="Sin movimientos";
return;
}

box.innerHTML="";

data.forEach(h=>{

box.innerHTML += `
<div class="historial-item">
${h.fecha}<br>
${h.detalle} - $${h.monto}
</div>
`;

});

}

function salir(){
localStorage.removeItem("usuario");
location.href="/";
}

</script>

</body>
</html>
