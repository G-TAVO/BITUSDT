<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Panel | Juego Tavo Demo</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

font-family:Arial,Helvetica,sans-serif;

background:
radial-gradient(
circle at top,
#164e63,
#0f172a 55%,
#020617
);

color:white;

min-height:100vh;

}

.container{

max-width:700px;

margin:auto;

padding:15px;

padding-bottom:60px;

}

.header{

background:#111827;

border:1px solid #334155;

border-radius:15px;

padding:20px;

text-align:center;

margin-bottom:15px;

}

.logo{

font-size:28px;

font-weight:bold;

color:#00ffcc;

}

.demo{

color:#facc15;

font-size:13px;

margin-top:7px;

}

.saldo-card{

background:#1e293b;

border:1px solid #334155;

border-radius:15px;

padding:20px;

text-align:center;

margin-bottom:15px;

}

.saldo-titulo{

color:#94a3b8;

font-size:14px;

}

.saldo{

font-size:32px;

font-weight:bold;

color:#22c55e;

margin-top:5px;

}

.card{

background:#1e293b;

border:1px solid #334155;

border-radius:15px;

padding:20px;

margin-top:15px;

}

h2{

margin-top:0;

color:#38bdf8;

text-align:center;

}

label{

display:block;

margin-top:12px;

margin-bottom:5px;

color:#cbd5e1;

font-size:14px;

}

input,
select{

width:100%;

padding:13px;

border-radius:8px;

border:1px solid #475569;

background:#0f172a;

color:white;

font-size:16px;

}

button{

width:100%;

padding:13px;

border:0;

border-radius:9px;

margin-top:12px;

font-weight:bold;

font-size:15px;

color:white;

cursor:pointer;

}

button:active{

transform:scale(.98);

}

.jugar{

background:#8b5cf6;

font-size:17px;

}

.jugar:hover{

background:#7c3aed;

}

.nequi{

background:#2563eb;

}

.retirar{

background:#f97316;

}

.actualizar{

background:#0ea5e9;

}

.salir{

background:#ef4444;

}

.eliminar{

background:#b91c1c;

margin-top:15px;

}

.eliminar:hover{

background:#991b1b;

}

.numero{

text-align:center;

font-size:40px;

font-weight:bold;

color:#facc15;

margin:15px 0;

}

/* ==============================
   RULETA
============================== */

.ruleta-contenedor{

display:flex;

justify-content:center;

align-items:center;

margin:20px 0;

position:relative;

}

.ruleta{

width:260px;

height:260px;

border-radius:50%;

border:8px solid #facc15;

position:relative;

display:flex;

justify-content:center;

align-items:center;

background:

conic-gradient(

#ef4444 0deg 18deg,

#111827 18deg 36deg,

#22c55e 36deg 54deg,

#111827 54deg 72deg,

#ef4444 72deg 90deg,

#111827 90deg 108deg,

#22c55e 108deg 126deg,

#111827 126deg 144deg,

#ef4444 144deg 162deg,

#111827 162deg 180deg,

#22c55e 180deg 198deg,

#111827 198deg 216deg,

#ef4444 216deg 234deg,

#111827 234deg 252deg,

#22c55e 252deg 270deg,

#111827 270deg 288deg,

#ef4444 288deg 306deg,

#111827 306deg 324deg,

#22c55e 324deg 342deg,

#111827 342deg 360deg

);

box-shadow:

0 0 20px rgba(250,204,21,.35),

inset 0 0 20px rgba(0,0,0,.7);

transition:transform 4s cubic-bezier(.15,.85,.15,1);

}

.ruleta-centro{

width:75px;

height:75px;

border-radius:50%;

background:#020617;

border:5px solid #facc15;

display:flex;

align-items:center;

justify-content:center;

font-size:20px;

font-weight:bold;

color:#facc15;

z-index:2;

}

.puntero{

position:absolute;

top:-10px;

left:50%;

transform:translateX(-50%);

width:0;

height:0;

border-left:15px solid transparent;

border-right:15px solid transparent;

border-top:30px solid #facc15;

z-index:5;

filter:drop-shadow(0 2px 3px #000);

}

.ruleta-numero{

text-align:center;

font-size:18px;

color:#cbd5e1;

margin-top:5px;

}

.girando{

animation:brillo 0.5s infinite alternate;

}

@keyframes brillo{

from{

box-shadow:

0 0 15px rgba(250,204,21,.3);

}

to{

box-shadow:

0 0 35px rgba(250,204,21,.8);

}

}

/* ==============================
   RESULTADO
============================== */

.resultado{

display:none;

padding:18px;

border-radius:12px;

text-align:center;

margin-top:15px;

font-size:18px;

font-weight:bold;

}

.gano{

background:#052e16;

border:1px solid #22c55e;

color:#86efac;

}

.perdio{

background:#450a0a;

border:1px solid #ef4444;

color:#fecaca;

}

.mensaje{

display:none;

padding:12px;

border-radius:9px;

text-align:center;

margin-top:10px;

}

.ok{

background:#052e16;

border:1px solid #22c55e;

color:#bbf7d0;

}

.error{

background:#450a0a;

border:1px solid #ef4444;

color:#fecaca;

}

.historial-item{

background:#111827;

border:1px solid #334155;

border-radius:10px;

padding:13px;

margin-top:10px;

line-height:1.7;

}

.ganado{

color:#22c55e;

font-weight:bold;

}

.perdido{

color:#ef4444;

font-weight:bold;

}

.info{

color:#cbd5e1;

line-height:1.7;

}

small{

color:#94a3b8;

}

@media(max-width:500px){

.container{

padding:10px;

}

.logo{

font-size:24px;

}

.saldo{

font-size:28px;

}

.ruleta{

width:230px;

height:230px;

}

}

</style>

</head>

<body>

<div class="container">

<!-- ==============================
     ENCABEZADO
============================== -->

<div class="header">

<div class="logo">
🎰 JUEGO TAVO
</div>

<div class="demo">
🧪 MODO DEMO — DINERO FICTICIO
</div>

</div>


<!-- ==============================
     SALDO
============================== -->

<div class="saldo-card">

<div class="saldo-titulo">
💰 TU SALDO DEMO
</div>

<div
class="saldo"
id="saldo">
$0
</div>

<button
class="actualizar"
onclick="cargarPerfil()">

🔄 Actualizar saldo

</button>

</div>


<!-- ==============================
     JUEGO
============================== -->

<div class="card">

<h2>
🎯 Jugar
</h2>

<div class="info">

Elige un número entre:

<b>00 y 99</b>

</div>


<!-- ==============================
     RULETA VISIBLE
============================== -->

<div class="ruleta-contenedor">

<div class="puntero"></div>

<div
id="ruleta"
class="ruleta">

<div
id="ruletaCentro"
class="ruleta-centro">

🎰

</div>

</div>

</div>

<div
id="ruletaNumero"
class="ruleta-numero">

🎯 Esperando partida...

</div>


<label>
Número
</label>

<input
type="number"
id="numero"
min="0"
max="99"
placeholder="Ejemplo: 07"
>


<label>
Apuesta
</label>

<select id="apuesta">

<option value="1000">
$1.000 → Premio $5.000
</option>

<option value="2000">
$2.000 → Premio $8.000
</option>

<option value="3000">
$3.000 → Premio $6.000
</option>

<option value="4000">
$4.000 → Premio $11.000
</option>

<option value="5000">
$5.000 → Premio $14.000
</option>

<option value="6000">
$6.000 → Premio $20.000
</option>

<option value="7000">
$7.000 → Premio $23.000
</option>

<option value="8000">
$8.000 → Premio $26.000
</option>

<option value="9000">
$9.000 → Premio $29.000
</option>

<option value="10000">
$10.000 → Premio $35.000
</option>

</select>


<button
id="btnJugar"
class="jugar"
onclick="jugar()">

🎰 JUGAR

</button>


<div
id="mensajeJuego"
class="mensaje">
</div>


<div
id="resultado"
class="resultado">
</div>

</div>


<!-- ==============================
     NEQUI
============================== -->

<div class="card">

<h2>
📱 Mi Nequi Demo
</h2>

<div class="info">

Registra el número donde aparecería
el retiro demo.

</div>

<input
type="tel"
id="nequi"
placeholder="Número Nequi"
>

<button
class="nequi"
onclick="guardarNequi()">

💾 Guardar Nequi

</button>

<div
id="mensajeNequi"
class="mensaje">
</div>

</div>


<!-- ==============================
     RETIRO
============================== -->

<div class="card">

<h2>
💸 Retiro Demo
</h2>

<div class="info">

Retiro mínimo:
<b>$10.000 demo</b>

</div>

<input
type="number"
id="montoRetiro"
placeholder="Monto a retirar"
min="10000"
>

<button
class="retirar"
onclick="solicitarRetiro()">

💸 Solicitar retiro demo

</button>

<div
id="mensajeRetiro"
class="mensaje">
</div>

</div>


<!-- ==============================
     HISTORIAL
============================== -->

<div class="card">

<h2>
📜 Historial de partidas
</h2>

<div id="historial">

Cargando...

</div>

<button
class="eliminar"
onclick="eliminarHistorial()">

🗑️ ELIMINAR TODO EL HISTORIAL

</button>

</div>


<!-- ==============================
     CERRAR SESIÓN
============================== -->

<button
class="salir"
onclick="salir()">

🚪 Cerrar sesión

</button>


</div>


<script>

/* ==========================================
   USUARIO
========================================== */

const usuario =
JSON.parse(
localStorage.getItem("usuario")
);


/* ==========================================
   VALIDAR SESIÓN
========================================== */

if(
!usuario ||
usuario.rol !== "user"
){

alert(
"No has iniciado sesión."
);

location.href="/";

}


/* ==========================================
   DATOS
========================================== */

const email =
usuario.email;


/* ==========================================
   FORMATO DINERO
========================================== */

function dinero(valor){

return Number(
valor || 0
).toLocaleString("es-CO");

}


/* ==========================================
   MENSAJES
========================================== */

function mostrarMensaje(
id,
texto,
tipo
){

const box =
document.getElementById(id);

box.textContent =
texto;

box.className =
"mensaje " + tipo;

box.style.display =
"block";

}


/* ==========================================
   CARGAR PERFIL
========================================== */

async function cargarPerfil(){

try{

const res =
await fetch(
"/api/perfil/" +
encodeURIComponent(email)
);

const data =
await res.json();

if(!data.ok){

return;

}

const u =
data.usuario;


document.getElementById(
"saldo"
).textContent =
"$" +
dinero(u.saldo);


document.getElementById(
"nequi"
).value =
u.nequi || "";


usuario.saldo =
u.saldo;

usuario.nequi =
u.nequi;

localStorage.setItem(
"usuario",
JSON.stringify(usuario)
);


}catch(error){

console.error(
"Error perfil:",
error
);

}

}


/* ==========================================
   RULETA ANIMADA
========================================== */

function animarRuleta(numeroGanador){

const ruleta =
document.getElementById(
"ruleta"
);

const numero =
document.getElementById(
"ruletaNumero"
);

ruleta.classList.add(
"girando"
);

numero.textContent =
"🎰 La ruleta está girando...";

const vueltas =
8;

const gradosNumero =
numeroGanador * 3.6;

const grados =
(vueltas * 360) +
(360 - gradosNumero);

ruleta.style.transform =
"rotate(" + grados + "deg)";

return new Promise(
resolve => {

setTimeout(
() => {

ruleta.classList.remove(
"girando"
);

numero.textContent =
"🎯 Número: " +
numeroVisual(numeroGanador);

resolve();

},
4200
);

});

}


/* ==========================================
   JUGAR
========================================== */

async function jugar(){

const numeroInput =
document.getElementById(
"numero"
);

const apuestaInput =
document.getElementById(
"apuesta"
);

const numero =
Number(
numeroInput.value
);

const apuesta =
Number(
apuestaInput.value
);

if(
!Number.isInteger(numero) ||
numero < 0 ||
numero > 99
){

mostrarMensaje(
"mensajeJuego",
"El número debe estar entre 00 y 99.",
"error"
);

return;

}


if(
!Number.isInteger(apuesta)
){

mostrarMensaje(
"mensajeJuego",
"Apuesta inválida.",
"error"
);

return;

}


const saldoActual =
Number(
usuario.saldo || 0
);


if(
saldoActual < apuesta
){

mostrarMensaje(
"mensajeJuego",
"Saldo demo insuficiente.",
"error"
);

return;

}


const btn =
document.getElementById(
"btnJugar"
);

btn.disabled =
true;

btn.textContent =
"🎰 PROCESANDO...";


mostrarMensaje(
"mensajeJuego",
"🎰 Jugando...",
"ok"
);


try{

const res =
await fetch(
"/api/jugar",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

email:
email,

numero:
numero,

apuesta:
apuesta

})

});


const data =
await res.json();


if(!data.ok){

mostrarMensaje(
"mensajeJuego",
data.msg ||
"Error al jugar.",
"error"
);

btn.disabled =
false;

btn.textContent =
"🎰 JUGAR";

return;

}


/* ==========================
   ANIMAR RULETA
========================== */

await animarRuleta(
data.numeroRuleta
);


/* ==========================
   ACTUALIZAR SALDO
========================== */

usuario.saldo =
data.saldo;

localStorage.setItem(
"usuario",
JSON.stringify(usuario)
);

document.getElementById(
"saldo"
).textContent =
"$" +
dinero(data.saldo);


/* ==========================
   RESULTADO
========================== */

const resultado =
document.getElementById(
"resultado"
);

resultado.style.display =
"block";


if(
data.resultado === "gano"
){

resultado.className =
"resultado gano";

resultado.innerHTML = `

🎉 ¡GANASTE!

<div class="numero">
${data.numeroRuletaVisual}
</div>

🏆 Premio:

$${dinero(data.premio)}

<br>

Saldo:

$${dinero(data.saldo)}

`;

}else{

resultado.className =
"resultado perdio";

resultado.innerHTML = `

😔 PERDISTE

<div class="numero">
${data.numeroRuletaVisual}
</div>

El número ganador fue:

<b>
${data.numeroRuletaVisual}
</b>

<br>

Perdiste:

$${dinero(data.apuesta)}

<br>

Saldo:

$${dinero(data.saldo)}

`;

}


mostrarMensaje(
"mensajeJuego",
data.mensaje ||
"Partida realizada.",
"ok"
);


cargarHistorial();


}catch(error){

console.error(error);

mostrarMensaje(
"mensajeJuego",
"No se pudo conectar con el servidor.",
"error"
);

}


/* ACTIVAR BOTÓN */

btn.disabled =
false;

btn.textContent =
"🎰 JUGAR";

}


/* ==========================================
   GUARDAR NEQUI
========================================== */

async function guardarNequi(){

const nequi =
document.getElementById(
"nequi"
).value.trim();


if(!nequi){

mostrarMensaje(
"mensajeNequi",
"Escribe tu número Nequi.",
"error"
);

return;

}


try{

const res =
await fetch(
"/api/nequi",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

email,
nequi

})

});


const data =
await res.json();


if(!data.ok){

mostrarMensaje(
"mensajeNequi",
data.msg ||
"No se pudo guardar.",
"error"
);

return;

}


usuario.nequi =
nequi;

localStorage.setItem(
"usuario",
JSON.stringify(usuario)
);


mostrarMensaje(
"mensajeNequi",
"✅ Número Nequi guardado.",
"ok"
);


}catch(error){

console.error(error);

mostrarMensaje(
"mensajeNequi",
"Error conectando con el servidor.",
"error"
);

}

}


/* ==========================================
   SOLICITAR RETIRO
========================================== */

async function solicitarRetiro(){

const monto =
Number(
document.getElementById(
"montoRetiro"
).value
);


if(
!Number.isInteger(monto) ||
monto < 10000
){

mostrarMensaje(
"mensajeRetiro",
"El retiro mínimo es de $10.000 demo.",
"error"
);

return;

}


if(
!usuario.nequi
){

mostrarMensaje(
"mensajeRetiro",
"Primero registra tu número Nequi.",
"error"
);

return;

}


if(
monto >
Number(usuario.saldo || 0)
){

mostrarMensaje(
"mensajeRetiro",
"No tienes suficiente saldo demo.",
"error"
);

return;

}


if(
!confirm(
`¿Solicitar retiro de $${dinero(monto)} demo?`
)
){

return;

}


try{

const res =
await fetch(
"/api/solicitar-retiro",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

email,
monto,
nequi:
usuario.nequi

})

});


const data =
await res.json();


if(!data.ok){

mostrarMensaje(
"mensajeRetiro",
data.msg ||
"Error solicitando retiro.",
"error"
);

return;

}


usuario.saldo =
data.saldo;

localStorage.setItem(
"usuario",
JSON.stringify(usuario)
);


document.getElementById(
"saldo"
).textContent =
"$" +
dinero(data.saldo);


document.getElementById(
"montoRetiro"
).value="";


mostrarMensaje(
"mensajeRetiro",
"✅ Solicitud de retiro demo enviada.",
"ok"
);


}catch(error){

console.error(error);

mostrarMensaje(
"mensajeRetiro",
"Error conectando con el servidor.",
"error"
);

}

}


/* ==========================================
   HISTORIAL
========================================== */

async function cargarHistorial(){

try{

const res =
await fetch(
"/api/historial/" +
encodeURIComponent(email)
);

const data =
await res.json();

const box =
document.getElementById(
"historial"
);


if(
!data.ok ||
!data.historial ||
data.historial.length === 0
){

box.innerHTML = `

<div class="info">

Todavía no tienes partidas.

</div>

`;

return;

}


box.innerHTML="";


data.historial.forEach(
p=>{

const gano =
p.resultado === "gano";


box.innerHTML += `

<div class="historial-item">

🎯 Número elegido:

<b>
${numeroVisual(p.numeroElegido)}
</b>

<br>

🎰 Salió:

<b>
${numeroVisual(p.numeroRuleta)}
</b>

<br>

💵 Apuesta:

$${dinero(p.apuesta)}

<br>

🏆 Premio:

$${dinero(p.premio)}

<br>

Resultado:

<span class="${
gano
?
"ganado"
:
"perdido"
}">

${
gano
?
"🎉 GANÓ"
:
"❌ PERDIÓ"
}

</span>

<br>

<small>
${escapeHtml(p.fecha || "")}
</small>

</div>

`;

});


}catch(error){

console.error(error);

document.getElementById(
"historial"
).innerHTML =
`
<div class="info">
No se pudo cargar el historial.
</div>
`;

}

}


/* ==========================================
   ELIMINAR TODO EL HISTORIAL
========================================== */

async function eliminarHistorial(){

const confirmar =
confirm(
"⚠️ ¿Estás seguro?\n\nSe eliminarán TODAS tus partidas del historial.\n\nEsta acción no se puede deshacer."
);

if(!confirmar){

return;

}


try{

const res =
await fetch(
"/api/historial/" +
encodeURIComponent(email),
{

method:"DELETE"

}

);


const data =
await res.json();


if(!data.ok){

mostrarMensaje(
"mensajeJuego",
data.msg ||
"No se pudo eliminar el historial.",
"error"
);

return;

}


document.getElementById(
"historial"
).innerHTML = `

<div class="info">

🗑️ Historial eliminado correctamente.

</div>

`;


alert(
"✅ Todo tu historial fue eliminado."
);


}catch(error){

console.error(error);

alert(
"❌ No se pudo conectar con el servidor."
);

}

}


/* ==========================================
   NÚMERO VISUAL
========================================== */

function numeroVisual(numero){

return String(
numero
).padStart(
2,
"0"
);

}


/* ==========================================
   ESCAPAR HTML
========================================== */

function escapeHtml(text){

return String(
text || ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* ==========================================
   CERRAR SESIÓN
========================================== */

function salir(){

localStorage.removeItem(
"usuario"
);

location.href="/";

}


/* ==========================================
   INICIAR
========================================== */

cargarPerfil();

cargarHistorial();


/* ==========================================
   ACTUALIZACIÓN
========================================== */

setInterval(
cargarPerfil,
10000
);

</script>

</body>

</html>
