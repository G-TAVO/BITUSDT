<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Préstamos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        h2 { text-align: center; }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #aaa;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #0056b3; }
        .link { text-align: center; margin-top: 10px; }
        .link a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Crear cuenta</h2>

    <input type="text" id="nombre" placeholder="Nombre completo">
    <input type="text" id="cedula" placeholder="Cédula">
    <input type="text" id="telefono" placeholder="Teléfono">
    <input type="text" id="whatsapp" placeholder="WhatsApp">
    <input type="email" id="email" placeholder="Correo electrónico">
    <input type="password" id="password" placeholder="Contraseña">

    <button onclick="registrar()">Registrarme</button>

    <div class="link">
        <a href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
    </div>
</div>

<script>
async function registrar() {
    const nombre = document.getElementById("nombre").value.trim();
    const cedula = document.getElementById("cedula").value.trim();
    const telefono = document.getElementById("telefono").value.trim();
    const whatsapp = document.getElementById("whatsapp").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!nombre || !cedula || !telefono || !whatsapp || !email || !password) {
        alert("⚠️ Todos los campos son obligatorios.");
        return;
    }

    const data = { nombre, cedula, telefono, whatsapp, email, password };

    try {
        const response = await fetch("/api/register", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.ok) {
            alert("✅ Registro exitoso");
            window.location.href = "login.html";
        } else {
            alert("❌ " + result.msg);
        }

    } catch (error) {
        alert("❌ Error de conexión con el servidor");
        console.error(error);
    }
}
</script>

</body>
</html>
