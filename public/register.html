<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>
</head>
<body>

  <h2>Registro de Usuario</h2>

  <form id="formRegister">

    <input type="text" id="nombre" placeholder="Nombre completo" required><br>

    <input type="text" id="cedula" placeholder="Cédula" required><br>

    <input type="text" id="telefono" placeholder="Teléfono" required><br>

    <input type="text" id="whatsapp" placeholder="WhatsApp" required><br>

    <input type="email" id="email" placeholder="Correo" required><br>

    <input type="password" id="password" placeholder="Contraseña" required><br>

    <button type="submit">Registrarme</button>

  </form>

  <p id="msg"></p>

  <script>
    const form = document.getElementById("formRegister");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
        nombre: document.getElementById("nombre").value.trim(),
        cedula: document.getElementById("cedula").value.trim(),
        telefono: document.getElementById("telefono").value.trim(),
        whatsapp: document.getElementById("whatsapp").value.trim(),
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value.trim()
      };

      const respuesta = await fetch("/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      const res = await respuesta.json();
      msg.innerText = res.msg;
    });
  </script>

</body>
</html>
