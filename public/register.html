<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro | Préstamos Tavo</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.container{
    width:90%;
    max-width:400px;
    background:#1e293b;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.3);
}
h2{
    text-align:center;
    color:#00ffcc;
    margin-bottom:20px;
}
input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
}
button{
    width:100%;
    padding:12px;
    margin-top:15px;
    background:#3b82f6;
    border:none;
    border-radius:8px;
    color:white;
    font-weight:bold;
    cursor:pointer;
    font-size:16px;
}
button:hover{
    background:#2563eb;
}
.link{
    text-align:center;
    margin-top:10px;
}
.link a{
    color:#00ffcc;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="container">
    <h2>Crear cuenta</h2>

    <input type="text" id="nombre" placeholder="Nombre completo">
    <input type="text" id="cedula" placeholder="Cédula">
    <input type="text" id="telefono" placeholder="Teléfono">
    <input type="text" id="whatsapp" placeholder="WhatsApp">
    <input type="email" id="email" placeholder="Correo electrónico">
    <input type="password" id="password" placeholder="Contraseña">

    <button onclick="registrar()">Registrarme</button>

    <div class="link">
        <a href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
    </div>
</div>

<script>
async function registrar(){

    const nombre = document.getElementById("nombre").value.trim();
    const cedula = document.getElementById("cedula").value.trim();
    const telefono = document.getElementById("telefono").value.trim();
    const whatsapp = document.getElementById("whatsapp").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if(!nombre || !cedula || !telefono || !whatsapp || !email || !password){
        alert("⚠️ Todos los campos son obligatorios");
        return;
    }

    const data = { nombre, cedula, telefono, whatsapp, email, password };

    const res = await fetch("/api/register", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify(data)
    });

    const result = await res.json();

    if(result.ok){
        alert("✅ Registro exitoso");
        window.location.href = "login.html";
    } else {
        alert("❌ " + result.msg);
    }
}
</script>

</body>
</html>
